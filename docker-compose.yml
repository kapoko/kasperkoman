services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build: ./wordpress
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_URL: ${WORDPRESS_URL}
      BUILD_WEBHOOK_SECRET: ${BUILD_WEBHOOK_SECRET}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WORDPRESS_URL}');
        define('WP_SITEURL', '${WORDPRESS_URL}');
        define('KK_ASTRO_WEBHOOK_URL', 'http://astro:4321/build');
        define('KK_BUILD_WEBHOOK_SECRET', '${BUILD_WEBHOOK_SECRET}');
    volumes:
      - ./data/wordpress:/var/www/html

  astro:
    build: ./astro
    working_dir: /app
    depends_on:
      - wordpress
    ports:
      - "4321:4321"
    environment:
      WORDPRESS_API_URL: http://host.docker.internal:8080
      PUBLIC_WORDPRESS_URL: ${WORDPRESS_URL}
      PUBLIC_SITE_URL: ${ASTRO_URL}
      BUILD_WEBHOOK_SECRET: ${BUILD_WEBHOOK_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/site:/app/dist
    command: node server.mjs

  wpcli:
    image: wordpress:cli
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_URL: ${WORDPRESS_URL}
      BUILD_WEBHOOK_SECRET: ${BUILD_WEBHOOK_SECRET}
    volumes:
      - ./data/wordpress:/var/www/html
      - ./data/import:/import:ro
    entrypoint: wp
